<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="app-data-source" content="auto" />
  <meta name="app-refresh-api" content="https://pulse-wall-api.yoryon.com" />
  <title>Open Source Pulse Wall</title>
  <meta name="description" content="A live Git classroom project for first-time open-source contributors." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://avatars.githubusercontent.com" crossorigin />
  <link rel="preconnect" href="https://pulse-wall-api.yoryon.com" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <svg class="edge-plant edge-plant-left" viewBox="0 0 160 360" aria-hidden="true">
    <path d="M86 342 C78 286 84 230 66 184 C50 140 42 92 55 26" />
    <path d="M69 226 C38 210 22 190 18 164 C45 168 64 186 69 226Z" />
    <path d="M76 172 C108 152 124 128 126 95 C94 104 78 127 76 172Z" />
    <path d="M61 118 C33 98 24 72 28 45 C54 55 66 80 61 118Z" />
    <path d="M82 270 C112 254 132 232 137 202 C108 207 88 232 82 270Z" />
  </svg>

  <div class="viewport-frame">
    <main class="page-shell pulse-dashboard" id="home">
      <svg class="paper-plane" viewBox="0 0 260 180" aria-hidden="true">
        <path class="plane-path" d="M232 152 C194 136 172 94 138 112 C110 126 94 74 58 64" />
        <path class="plane" d="M18 32 L78 52 L44 74 L38 55 L18 32Z" />
        <path class="plane-fold" d="M38 55 L78 52" />
        <path class="plane-fold" d="M38 55 L48 80" />
      </svg>

      <header class="topbar">
        <a class="brand" href="#home" aria-label="Open Source Pulse Wall home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <path d="M24 37 V12" />
              <path d="M24 15 C18 16 14 21 15 27 C20 26 24 21 24 15Z" />
              <path d="M24 19 C30 18 34 22 33 28 C28 28 24 24 24 19Z" />
              <path d="M24 26 C18 27 14 31 16 36 C20 35 24 31 24 26Z" />
              <path d="M24 28 C30 28 33 32 32 36 C28 36 24 33 24 28Z" />
            </svg>
          </span>
          <span>
            <strong>Open Source Pulse Wall</strong>
            <small>GitHub 协作展示墙</small>
          </span>
        </a>
        <div class="topbar-actions">
          <a class="guide-entry" href="https://github.com/nanzhi84/open-source-pulse-wall#贡献步骤指南" target="_blank" rel="noreferrer" aria-label="打开 GitHub README 贡献指南">
            <span>
              <strong>开始贡献</strong>
              <small>README</small>
            </span>
          </a>
          <a class="github-repo-link" id="openTopRepo" href="https://github.com/nanzhi84/open-source-pulse-wall" target="_blank" rel="noreferrer" aria-label="打开 GitHub 仓库" title="打开 GitHub 仓库">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.21.08 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6.02 0c2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .5Z" /></svg>
          </a>
          <a class="star-badge" id="starBadgeLink" href="https://github.com/nanzhi84/open-source-pulse-wall" target="_blank" rel="noreferrer" aria-label="给项目点亮 Star 解锁限定闪卡特效" title="给项目点亮 Star，自动解锁你的专属随机闪卡特效">
            <span>Star</span>
            <strong id="starCount">--</strong>
          </a>
        </div>
      </header>

      <section class="feedback-panel" id="feedback" aria-label="实时反馈">
        <div class="feedback-left">
          <div class="panel-title-row">
            <h2>实时反馈</h2>
            <span class="live-status-pill">
              <i class="status-dot" id="connectionDot" aria-hidden="true"></i>
              <span id="connectionText">实时更新中</span>
            </span>
            <button class="refresh-pill" id="refreshWall" type="button" aria-live="polite" title="立即同步最新贡献者、星标特效与寄语">
              <span class="refresh-pill-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3.5-7.1" /><path d="M21 4v5h-5" /></svg>
              </span>
              <span id="refreshWallLabel">立即刷新</span>
            </button>
          </div>
          <div class="stats-row">
            <article class="stat-card" id="statCardCount">
              <span>贡献者</span>
              <strong id="statCount">0</strong>
              <small id="statCountNote" class="sr-only">等待 GitHub 同步</small>
            </article>
            <article class="stat-card">
              <span>验证通过</span>
              <strong id="statValidation">...</strong>
            </article>
            <article class="stat-card" id="statCardIssues">
              <span>Issue 累计</span>
              <strong id="statIssues">--</strong>
              <small id="statIssuesNote" class="sr-only">open / closed</small>
            </article>
            <article class="stat-card" id="statCardReview">
              <span>等待 Review</span>
              <strong id="statReview">--</strong>
              <small id="statReviewNote" class="sr-only">PR 等同学回应</small>
            </article>
            <article class="stat-card" id="statCardPulse">
              <span>最后更新</span>
              <strong id="statPulse">...</strong>
              <small id="statStacks" class="sr-only">实时同步</small>
            </article>
          </div>
        </div>

        <aside class="feed-box" aria-label="最近活动">
          <div class="feed-head">
            <strong>最近活动</strong>
            <button class="view-all-feed" id="viewAllFeed" type="button" aria-haspopup="dialog" aria-controls="activityPanel" aria-expanded="false">查看全部</button>
          </div>
          <ol id="liveFeed"></ol>
        </aside>
      </section>

      <section class="wall-section dashboard-main" id="wall" aria-label="贡献者大厅">
        <div class="wall-header">
          <div class="wall-title-group">
            <h2>贡献者大厅</h2>
            <p class="wall-summary" id="wallSummary">· 等待贡献者数据</p>
          </div>
          <div class="wall-toolbar">
            <label class="wall-search" for="wallSearch">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-5.2-5.2" /><circle cx="10.8" cy="10.8" r="6.8" /></svg>
              <span class="sr-only">搜索贡献者</span>
              <input id="wallSearch" type="search" placeholder="搜索名字、GitHub、城市或寄语" autocomplete="off" />
              <button class="wall-clear-search" id="clearWallSearch" type="button" aria-label="清空搜索" hidden>×</button>
            </label>
            <div class="wall-filter-pills" role="group" aria-label="贡献者筛选">
              <button type="button" class="wall-filter-pill is-active" data-wall-filter="all" aria-pressed="true">全部</button>
              <button type="button" class="wall-filter-pill" data-wall-filter="starred" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.8 2.85 5.78 6.38.93-4.62 4.5 1.09 6.35L12 17.36l-5.7 3 1.09-6.35-4.62-4.5 6.38-.93Z" /></svg>
                <span>星标限定</span>
              </button>
              <button type="button" class="wall-filter-pill" data-wall-filter="cheers" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-6l-4 3v-3H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z" /></svg>
                <span>收到寄语</span>
              </button>
            </div>
          </div>
        </div>

        <div class="wall-scroll-viewport" tabindex="0" aria-label="贡献者卡片列表">
          <div class="wall" id="contributorsWall"></div>
        </div>
      </section>
    </main>

    <footer class="about" id="about">
      <p>
        <span>© 2026 Open Source Pulse Wall · git很重要，好好学习</span>
        <button type="button" class="wall-motion-toggle" id="toggleWallMotion" title="暂停或恢复星标卡片动态特效" hidden>暂停动效</button>
      </p>
    </footer>
  </div>

  <div class="activity-overlay" id="activityOverlay" hidden>
    <section class="activity-panel" id="activityPanel" role="dialog" aria-modal="true" aria-labelledby="activityTitle" tabindex="-1">
      <div class="activity-panel-head">
        <div>
          <h2 id="activityTitle">全部活动</h2>
          <p id="activityCount">等待活动记录</p>
        </div>
        <button class="activity-close" id="closeActivity" type="button" aria-label="关闭全部活动">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <ol class="activity-list" id="activityList"></ol>
    </section>
  </div>

  <div class="activity-overlay cheers-overlay" id="cheersOverlay" hidden>
    <section class="activity-panel cheers-panel" id="cheersPanel" role="dialog" aria-modal="true" aria-labelledby="cheersTitle" tabindex="-1">
      <div class="activity-panel-head">
        <div>
          <h2 id="cheersTitle">全部寄语</h2>
          <p id="cheersSubtitle">等待加载</p>
        </div>
        <button class="activity-close" id="closeCheers" type="button" aria-label="关闭全部寄语">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <ol class="activity-list cheers-full-list" id="cheersFullList"></ol>
    </section>
  </div>

  <div class="validation-box" id="validationBox" aria-live="polite"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script defer src="app.js"></script>
</body>
</html>
