name: PR guard & review bot

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Evaluate PR paths, format rules, and post review comment
        id: guard
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_MAINTAINERS: ${{ vars.PR_MAINTAINERS }}
        with:
          script: |
            const path = require('path');
            const {
              COMMENT_MARKER,
              evaluatePrGuard,
              formatGuardComment,
              inspectValidationState,
              listProfileFiles,
              listCheerFiles,
              parseMaintainers
            } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'pr-guard.js'));
            const {
              fetchPrChangedFilesAndContents,
              upsertCommentByMarker
            } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'auto-merge-queue.js'));

            const pr = context.payload.pull_request;
            const prAuthor = String(pr.user?.login || '').trim();
            const maintainers = parseMaintainers(process.env.PR_MAINTAINERS);
            const headSha = pr.head?.sha || '';
            const isDraft = Boolean(pr.draft);

            const { changedFiles, fileContents } = await fetchPrChangedFilesAndContents({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pr,
              core
            });

            const existingProfileFiles = listProfileFiles(process.env.GITHUB_WORKSPACE);
            const existingCheerFiles = listCheerFiles(process.env.GITHUB_WORKSPACE);
            const result = evaluatePrGuard({
              prAuthor,
              changedFiles,
              fileContents,
              existingProfileFiles,
              existingCheerFiles,
              maintainers
            });

            if (result.skipped) {
              core.info(`PR guard skipped for maintainer @${prAuthor}.`);
              return;
            }

            let approvalRequired = false;
            let workflowRunUrl = '';
            if (result.ok && !isDraft && headSha) {
              try {
                const wfRes = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head_sha: headSha,
                  event: 'pull_request',
                  per_page: 20
                });
                const validation = inspectValidationState({
                  workflowRuns: wfRes?.data?.workflow_runs || []
                });
                approvalRequired = validation.validateState === 'approval_required';
                workflowRunUrl = validation.workflowRunUrl;
              } catch (wfError) {
                core.info(`Could not inspect validate workflow status yet: ${wfError.message}`);
              }
            }

            const body = formatGuardComment(result, {
              headSha,
              isDraft,
              approvalRequired,
              workflowRunUrl,
              maintainers
            });

            await upsertCommentByMarker({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              issueNumber: pr.number,
              marker: COMMENT_MARKER,
              body,
              core
            });

            if (!result.ok) {
              core.setFailed(`PR guard found ${result.errors.length} issue(s):\n- ${result.errors.join('\n- ')}`);
              return;
            }

            if (isDraft) {
              core.info(`PR #${pr.number} is a draft; auto-merge queue not dispatched.`);
              return;
            }

            if (approvalRequired) {
              core.notice(`PR #${pr.number} requires maintainer approval for validate workflow; notified maintainers.`);
              return;
            }

            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'auto-merge-queue.yml',
                ref: 'main'
              });
              core.info(`Dispatched auto-merge-queue.yml for PR #${pr.number}.`);
            } catch (dispatchError) {
              core.warning(`Failed to dispatch auto-merge-queue.yml: ${dispatchError.message}`);
            }
