name: PR guard & review bot

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      should_auto_merge: ${{ steps.guard.outputs.should_auto_merge }}
      head_sha: ${{ steps.guard.outputs.head_sha }}
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Evaluate PR paths, format rules, and post review comment
        id: guard
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const path = require('path');
            const {
              normalizeGithubPrFiles,
              evaluatePrGuard,
              formatGuardComment,
              listProfileFiles,
              listCheerFiles,
              parseMaintainers
            } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'pr-guard.js'));

            const pr = context.payload.pull_request;
            const prAuthor = String(pr.user?.login || '').trim();
            const maintainers = parseMaintainers(process.env.PR_MAINTAINERS);
            const headSha = pr.head?.sha || '';

            core.setOutput('head_sha', headSha);
            core.setOutput('should_auto_merge', 'false');

            const apiFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const changedFiles = normalizeGithubPrFiles(apiFiles);
            const fileContents = {};

            const headOwner = pr.head?.repo?.owner?.login || context.repo.owner;
            const headRepo = pr.head?.repo?.name || context.repo.repo;

            for (const file of changedFiles) {
              if (file.status === 'D') continue;
              const isTargetJson =
                (file.path.startsWith('data/profiles/') || file.path.startsWith('data/cheers/')) &&
                file.path.endsWith('.json') &&
                !path.basename(file.path).startsWith('_');

              if (!isTargetJson) continue;

              try {
                if (file.sha) {
                  const blob = await github.rest.git.getBlob({
                    owner: headOwner,
                    repo: headRepo,
                    file_sha: file.sha
                  });
                  fileContents[file.path] = Buffer.from(blob.data.content || '', 'base64').toString('utf8');
                } else if (headSha) {
                  const contentRes = await github.rest.repos.getContent({
                    owner: headOwner,
                    repo: headRepo,
                    path: file.path,
                    ref: headSha
                  });
                  if (!Array.isArray(contentRes.data) && contentRes.data.content) {
                    fileContents[file.path] = Buffer.from(contentRes.data.content, 'base64').toString('utf8');
                  }
                }
              } catch (readError) {
                core.warning(`Failed to fetch content for ${file.path}: ${readError.message}`);
              }
            }

            const existingProfileFiles = listProfileFiles(process.env.GITHUB_WORKSPACE);
            const existingCheerFiles = listCheerFiles(process.env.GITHUB_WORKSPACE);
            const result = evaluatePrGuard({
              prAuthor,
              changedFiles,
              fileContents,
              existingProfileFiles,
              existingCheerFiles,
              maintainers
            });

            if (result.skipped) {
              core.info(`PR guard skipped for maintainer @${prAuthor}.`);
              return;
            }

            const body = formatGuardComment(result, { headSha });
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body
              });
            } catch (commentError) {
              core.warning(`Failed to post PR guard comment: ${commentError.message}`);
            }

            if (!result.ok) {
              core.setFailed(`PR guard found ${result.errors.length} issue(s):\n- ${result.errors.join('\n- ')}`);
              return;
            }

            core.setOutput('should_auto_merge', 'true');

  delayed-auto-merge:
    needs: pr-guard
    if: ${{ success() && needs.pr-guard.outputs.should_auto_merge == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Wait 5 minutes before auto-merge
        run: sleep 300

      - name: Verify latest PR state, checks, and merge
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EXPECTED_HEAD_SHA: ${{ needs.pr-guard.outputs.head_sha }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const expectedSha = String(process.env.EXPECTED_HEAD_SHA || '').trim();

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            if (pr.state !== 'open' || pr.merged) {
              core.info(`PR #${prNumber} is already closed or merged; skipping auto-merge.`);
              return;
            }

            if (pr.draft) {
              core.info(`PR #${prNumber} is a draft; skipping auto-merge.`);
              return;
            }

            if (!expectedSha || pr.head.sha !== expectedSha) {
              core.info(`PR #${prNumber} head SHA changed (${expectedSha} -> ${pr.head.sha}); aborting stale auto-merge.`);
              return;
            }

            const { data: checkData } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: expectedSha,
              per_page: 100
            });

            const requiredContexts = ['validate', 'pr-guard'];
            for (const name of requiredContexts) {
              const matching = (checkData.check_runs || []).filter((run) => run.name === name);
              const latest = matching.sort((a, b) => Number(b.id) - Number(a.id))[0];
              if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
                core.info(
                  `Required check "${name}" is not green (${latest ? `${latest.status}/${latest.conclusion}` : 'missing'}); skipping auto-merge.`
                );
                return;
              }
            }

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                sha: expectedSha,
                merge_method: 'squash'
              });
              core.notice(`Auto-merged PR #${prNumber} (${expectedSha.slice(0, 7)}) after 5-minute delay.`);
            } catch (mergeError) {
              core.warning(`Auto-merge skipped for PR #${prNumber}: ${mergeError.message}`);
            }
